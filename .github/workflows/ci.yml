name: Artemis CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  frontend:
    name: Frontend Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  backend:
    name: Python Discovery Service Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: services/donation-discovery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check & import verification
        working-directory: services/donation-discovery
        run: |
          python -m compileall app/
